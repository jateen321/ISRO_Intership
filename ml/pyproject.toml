[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geoshield-ml"
version = "0.1.0"
description = "Reproducible multi-temporal satellite damage assessment models."
requires-python = ">=3.11,<3.15"
dependencies = [
  "albumentations>=2.0,<3",
  "numpy>=2.0,<3",
  "onnx>=1.17,<2",
  "onnxruntime>=1.20,<2",
  "onnxscript>=0.1,<1",
  "pillow>=10,<12",
  "rasterio>=1.3,<2",
  "scikit-learn>=1.5,<2",
  "shapely>=2.0,<3",
  "torch>=2.3,<3",
  "torchvision>=0.18,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7"]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
